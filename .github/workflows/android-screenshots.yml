name: Android screenshots

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-planck-3qqqvh]
    paths: [".github/workflows/android-screenshots.yml", "starlight-astro-android/app/src/androidTest/**"]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tour on an emulator and pull screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: starlight-astro-android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p ../docs/screenshots
            adb pull /sdcard/Android/data/com.starlightastro.app/files/shots/. ../docs/screenshots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add app screenshots" || exit 0
          git push
