# Publishes a static demo of Exam Hub to GitHub Pages.
# The demo is Hindi-only and has no contact/purchase backend (static hosting).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, feat/exam-hub-phase-1-3]
  workflow_dispatch:
  schedule:
    # Daily 00:10 IST rebuild so "days left" and exam status stay current.
    - cron: "40 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          # API routes need a server; the static demo doesn't ship them.
          rm -rf src/app/api
          npx next build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
