<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Practice Paper Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap">
<style>
  :root{--bg:#182030;--card:#1f2839;--field:#0f1522;--line:#313b52;--text:#e6e9f0;--muted:#9aa3b5;--accent:#e6a23c;--on:#1d1404;--err:#e57373;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Hind","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;}
  form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;}
  h1{margin:0;font-size:20px;font-weight:700;}
  p{margin:0;color:var(--muted);font-size:13.5px;}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
  input[type=text],input[type=password]{background:var(--field);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 10px;font-size:15px;font-family:inherit;}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);}
  .chk input{accent-color:var(--accent);width:16px;height:16px;}
  button{background:var(--accent);color:var(--on);border:none;border-radius:6px;padding:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{min-height:18px;font-size:13px;color:var(--err);}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Practice Paper Generator</h1>
  <p>Sign in to open the paper generator.</p>
  <label>User ID<input id="u" type="text" autocomplete="username" required autofocus></label>
  <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
  <label class="chk"><input id="r" type="checkbox"> Keep me signed in on this device</label>
  <button id="b" type="submit">Sign in</button>
  <div class="msg" id="m" role="alert"></div>
</form>

  var KEY_STORE='ppg.key';
  function un(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  function show(html){document.open();document.write(html);document.close();}
  async function open(key){
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(DATA.iv)},key,un(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  async function derive(id,pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(id.trim().toLowerCase()+'\u0000'+pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:un(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function tryStored(){
    var raw=null;
    try{raw=sessionStorage.getItem(KEY_STORE)||localStorage.getItem(KEY_STORE);}catch(e){}
    if(!raw)return;
    try{
      var key=await crypto.subtle.importKey('jwk',JSON.parse(raw),{name:'AES-GCM'},true,['decrypt']);
      show(await open(key));
    }catch(e){try{sessionStorage.removeItem(KEY_STORE);localStorage.removeItem(KEY_STORE);}catch(_){}}
  }
  if(!window.crypto||!crypto.subtle){document.getElementById('m').textContent='This browser cannot open the page. Use a recent Chrome, Edge, Firefox or Safari over https.';return;}
  tryStored();
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var b=document.getElementById('b'),m=document.getElementById('m');
    b.disabled=true;b.textContent='Checking…';m.textContent='';
    try{
      var key=await derive(document.getElementById('u').value,document.getElementById('p').value);
      var html=await open(key);
      try{
        var jwk=JSON.stringify(await crypto.subtle.exportKey('jwk',key));
        sessionStorage.setItem(KEY_STORE,jwk);
        if(document.getElementById('r').checked)localStorage.setItem(KEY_STORE,jwk);
      }catch(_){}
      show(html);
    }catch(err){
      m.textContent='Wrong user ID or password.';
      b.disabled=false;b.textContent='Sign in';
    }
  });
