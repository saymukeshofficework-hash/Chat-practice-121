<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>कक्षा 10 विकल्प प्रश्न</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Rozha+One&display=swap">
<style>
/* Minimal layout: hairline cards, slim sticky timer, one meta line, bottom submit bar */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#18201c; --muted:#6b756f; --line:#e4e8e6; --soft:#f6f8f7;
  --accent:#0f6b4f; --accent-soft:#eaf4ef; --year:#8a4b0f; --year-soft:#fbf1e4;
  --good:#1c7a3e; --good-soft:#e6f5ea; --bad:#b3261e; --bad-soft:#fcebea;
  --display:"Rozha One","Tiro Devanagari Hindi",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
:root{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,36px);line-height:1.15;margin:0;text-align:center;text-wrap:balance}
.desc{text-align:center;margin:0 0 8px;font-size:15px;color:var(--muted)}
.desc b{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.field label{font-weight:600;display:block;font-size:15px;color:var(--muted)}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--bg)}
.subj{gap:4px}
.subj h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.subj h2 small{font-family:var(--body);font-size:14px;color:var(--muted)}
.subj p{margin:0 0 8px;color:var(--muted);font-size:14px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;font-weight:600;padding:8px 16px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.subj .btn{background:var(--accent-soft);color:var(--accent)}
.subj .btn:hover{background:var(--accent);color:#fff}
.btn:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;justify-content:center;align-items:baseline;gap:10px;padding:8px 0;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.timer .l{font-size:13px;color:var(--muted)}
.timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low .t{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:15px;color:var(--muted);padding:2px 2px 0}
.meta b{color:var(--ink);font-size:17px}
.qtext{font-size:19px;margin:0;font-weight:500}
.qen{font-size:14px;color:var(--muted);margin:-8px 0 0}
.mark{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:1px 10px;border-radius:999px;background:var(--year-soft);color:var(--year)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid var(--line);font-size:17px}
.opt:hover{background:var(--soft)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.req{display:none}
.res{font-weight:600;margin:0;font-size:15px}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock .cnt{font-size:15px;color:var(--muted)}.dock .cnt b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.dock button.check{font:inherit;font-size:16px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.ask{max-width:640px;margin:10px auto 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.score{font-family:var(--display);font-size:52px;line-height:1;margin:0;text-align:center}
#scorecard{align-items:center;text-align:center;background:var(--soft);border-color:transparent}
.rname{font-size:16px;font-weight:600;margin:0;color:var(--muted)}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.nerr{color:var(--bad);font-size:14px;margin:0}
.side{position:fixed;z-index:-1;pointer-events:none;background:url(saraswati.webp) center/cover no-repeat}
@media (min-width:1000px){.side{left:0;top:0;bottom:0;width:calc((100vw - 640px)/2 - 24px);-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}}
@media (max-width:999px){.side{left:-34vw;top:18vh;width:100vw;height:100vw;opacity:.32;-webkit-mask-image:radial-gradient(circle,#000 35%,transparent 70%);mask-image:radial-gradient(circle,#000 35%,transparent 70%)}.card{background:rgba(255,255,255,.86)}}
[hidden]{display:none!important}
</style>
</head><body>

<div class="side" aria-hidden="true"></div>
<div class="wrap">
  <h1 id="htitle">कक्षा 10 विकल्प प्रश्न</h1>
  <p class="desc" id="desc">संकलनकर्ता: <b>मुकेश दाहिया</b></p>

  <section id="home" style="display:flex;flex-direction:column;gap:18px">
    <div class="card field"><label for="sname">विद्यार्थी का नाम</label><input type="text" id="sname" placeholder="अपना नाम लिखें" autocomplete="off"><p class="nerr" id="nerr" hidden>टेस्ट शुरू करने से पहले अपना नाम लिखें।</p></div>
    <div id="subjects" style="display:flex;flex-direction:column;gap:18px"></div>
    <footer>हर प्रश्न के साथ वह वर्ष लिखा है जब वह MP Board में पूछा गया: “बोर्ड” = वार्षिक परीक्षा, “मॉडल” = मंडल का आदर्श प्रश्न पत्र।</footer>
  </section>

  <section id="quiz" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="timer" id="timer"><span class="l">समय शेष</span><span class="t" id="tt">20:00</span></div>
    <div class="meta"><span><b id="wname"></b> · <span id="wset"></span></span><span><span id="tq">15</span> प्रश्न · <span id="tm">15</span> अंक</span></div>
    <div class="card" id="scorecard" hidden>
      <p class="rname" id="rname"></p>
      <p class="score" id="rscore"></p>
      <p id="rmsg" style="margin:0;text-align:center"></p>
      <div class="sets" style="justify-content:center"><button class="btn" id="again">फिर से हल करें</button><button class="btn ghost" id="back">दूसरा क्विज़</button></div>
    </div>
    <div id="qs" style="display:flex;flex-direction:column;gap:18px"></div>
  </section>
</div>

<div class="dock" id="dock" hidden>
  <div class="in"><span class="cnt">Answered <b id="ans">0</b> of <span id="tot">15</span></span><button class="check" id="submit" aria-label="Submit">Submit ✔</button></div>
  <div class="ask" id="ask" hidden><span id="askmsg"></span><button class="btn" id="yes">हाँ, Submit करें</button><button class="btn ghost" id="no">रुकें</button></div>
</div>

  $("rscore").textContent=`${sc} / ${t}`;
  $("rname").textContent="विद्यार्थी: "+nm+" · "+DATA[cur.k].name+" सेट "+(cur.i+1);
  $("rmsg").textContent=p+"% · "+(p>=80?"शाबाश! बोर्ड के लिए अच्छी तैयारी है।":p>=50?"अच्छा प्रयास। गलत प्रश्न दोबारा पढ़ें।":"इन अध्यायों को फिर से दोहराएँ।");
  $("ans").textContent=`${sc}`;document.querySelector(".dock .cnt").innerHTML=`प्राप्तांक <b>${sc}</b> / ${t}`;
  $("scorecard").hidden=false;window.scrollTo({top:0,behavior:"smooth"});
}
$("again").onclick=()=>{document.querySelector(".dock .cnt").innerHTML=`Answered <b id="ans">0</b> of <span id="tot">15</span>`;start(cur.k,cur.i)};
$("back").onclick=()=>{document.querySelector(".dock .cnt").innerHTML=`Answered <b id="ans">0</b> of <span id="tot">15</span>`;clearInterval(timerId);$("quiz").hidden=true;$("dock").hidden=true;$("home").hidden=false;
  $("htitle").hidden=false;$("desc").hidden=false;window.scrollTo(0,0)};
</script>
</body></html>
