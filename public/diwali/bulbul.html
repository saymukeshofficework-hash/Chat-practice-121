<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Diwali, Bulbul</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0420;font-family:Georgia,'Times New Roman',serif}
  body{background:radial-gradient(ellipse at 50% 100%,#4a1259 0%,#1a0838 45%,#05010f 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #stars{z-index:0}#fire{z-index:1}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;pointer-events:none}
  .om{font-size:clamp(40px,9vw,72px);color:#ffd36b;text-shadow:0 0 24px #ff9d00;animation:pulse 2.4s ease-in-out infinite}
  h1{font-size:clamp(34px,9vw,84px);color:#ffe9a8;letter-spacing:.04em;text-shadow:0 0 18px #ff8c00,0 0 44px #ff4d00;margin:.15em 0}
  h1 span{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);animation:letter .8s cubic-bezier(.2,1.4,.4,1) forwards}
  .name{font-size:clamp(46px,13vw,120px);font-weight:bold;background:linear-gradient(90deg,#ff7a18,#ffd36b,#ff4fa3,#ffd36b,#ff7a18);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite,pop 1.2s 1.6s cubic-bezier(.2,1.6,.4,1) backwards;filter:drop-shadow(0 0 16px #ff8a00)}
  .sub{margin-top:14px;font-size:clamp(14px,3.6vw,22px);color:#f6d8ff;max-width:520px;line-height:1.5;opacity:0;animation:fade 1.5s 2.8s forwards}
  .diyas{position:fixed;bottom:12px;left:0;right:0;z-index:3;display:flex;justify-content:space-around;pointer-events:none;padding:0 4vw}
  .diya{position:relative;width:clamp(34px,8vw,64px);height:clamp(18px,4vw,32px)}
  .diya .bowl{position:absolute;bottom:0;width:100%;height:70%;background:linear-gradient(#e0742b,#8a2f0c);border-radius:0 0 100% 100%/0 0 100% 100%;box-shadow:0 0 20px rgba(255,140,0,.6)}
  .diya .flame{position:absolute;left:50%;bottom:62%;width:28%;height:110%;margin-left:-14%;background:radial-gradient(ellipse at 50% 80%,#fff7c2 0%,#ffb400 45%,rgba(255,80,0,0) 75%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flicker .35s ease-in-out infinite alternate;filter:blur(.4px);box-shadow:0 0 28px 8px rgba(255,170,0,.55)}
  .diya:nth-child(2n) .flame{animation-duration:.45s}.diya:nth-child(3n) .flame{animation-duration:.3s}
  .lantern{position:fixed;bottom:-80px;z-index:1;width:30px;height:42px;border-radius:40% 40% 45% 45%;background:linear-gradient(#ffcf5a,#ff7a00);box-shadow:0 0 22px 6px rgba(255,150,0,.6);opacity:.9;animation:rise linear forwards}
  .lantern::before{content:"";position:absolute;top:-6px;left:25%;width:50%;height:6px;background:#7a3a00;border-radius:3px}
  @keyframes rise{to{transform:translateY(-120vh) translateX(var(--dx));opacity:0}}
  @keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
  @keyframes letter{to{opacity:1;transform:none}}
  @keyframes shine{to{background-position:300% 0}}
  @keyframes pop{from{opacity:0;transform:scale(.2) rotate(-8deg)}}
  @keyframes fade{to{opacity:1}}
  @keyframes pulse{50%{transform:scale(1.12);text-shadow:0 0 40px #ffb300}}
  .hint{position:fixed;top:10px;width:100%;text-align:center;color:#b99ad6;font-size:12px;z-index:3;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fire"></canvas>
<div class="hint">Tap anywhere for fireworks ✨</div>
<div class="stage">
  <div class="om">🪔</div>
  <h1 id="title"></h1>
  <div class="name">Bulbul</div>
  <p class="sub">May the festival of lights fill your life with joy, prosperity and endless happiness. शुभ दीपावली!</p>
</div>
<div class="diyas" id="diyas"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
// Title letters
const t="Happy Diwali";
$('title').innerHTML=[...t].map((c,i)=>`<span style="animation-delay:${.15+i*.09}s">${c===' '?'&nbsp;':c}</span>`).join('');
// Diyas
$('diyas').innerHTML=Array.from({length:9},()=>'<div class="diya"><div class="flame"></div><div class="bowl"></div></div>').join('');
// Lanterns
function lantern(){
  const l=document.createElement('div');l.className='lantern';
  const s=.6+Math.random()*1.1;
  l.style.left=Math.random()*100+'vw';l.style.transform=`scale(${s})`;
  l.style.setProperty('--dx',(Math.random()*120-60)+'px');
  l.style.animationDuration=(9+Math.random()*9)+'s';
  document.body.appendChild(l);setTimeout(()=>l.remove(),19000);
}
setInterval(lantern,900);for(let i=0;i<5;i++)setTimeout(lantern,i*300);

// Starfield
const sc=$('stars'),sx=sc.getContext('2d');let W,H,stars=[];
function size(){W=innerWidth;H=innerHeight;for(const c of [sc,fc]){c.width=W;c.height=H}
  stars=Array.from({length:Math.floor(W*H/6000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6}))}
const fc=$('fire'),fx=fc.getContext('2d');size();addEventListener('resize',size);

// Fireworks
const rockets=[],parts=[];
const hues=[20,35,48,330,280,190,120];
function launch(x,y){
  rockets.push({x:x??Math.random()*W*.8+W*.1,y:H,ty:y??H*(.12+Math.random()*.4),vy:-(8+Math.random()*3),hue:hues[Math.random()*hues.length|0]});
}
function burst(x,y,hue){
  const n=70+Math.random()*50|0,kind=Math.random();
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,sp=kind<.35?4.2:(1.5+Math.random()*4.5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.012,
      hue:hue+(Math.random()*40-20),g:.045,sz:1.2+Math.random()*1.6});
  }
}
addEventListener('pointerdown',e=>launch(e.clientX,e.clientY));
setInterval(()=>launch(),750);
for(let i=0;i<3;i++)setTimeout(()=>launch(),i*350);

let f=0;
(function loop(){
  f++;
  // stars
  sx.clearRect(0,0,W,H);
  for(const s of stars){const a=.4+.6*Math.abs(Math.sin(f*.02+s.p));sx.fillStyle=`rgba(255,240,210,${a})`;sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.3);sx.fill()}
  // fireworks trails
  fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.22)';fx.fillRect(0,0,W,H);
  fx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.y+=r.vy;r.vy*=.985;
    fx.fillStyle=`hsl(${r.hue},100%,70%)`;fx.beginPath();fx.arc(r.x,r.y,2.4,0,6.3);fx.fill();
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.hue);rockets.splice(i,1)}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.life-=p.decay;
    if(p.life<=0){parts.splice(i,1);continue}
    fx.fillStyle=`hsla(${p.hue},100%,${55+p.life*20}%,${p.life})`;
    fx.beginPath();fx.arc(p.x,p.y,p.sz*p.life+.3,0,6.3);fx.fill();
  }
  requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
